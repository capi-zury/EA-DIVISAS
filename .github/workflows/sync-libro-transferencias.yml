# Trae el "Libro de transferencias" (control diario, septiembre 2026 en
# adelante) desde OneDrive/SharePoint todos los días y registra las
# transferencias nuevas — misma lógica que "sync-estado-cuenta" pero con el
# formato nuevo (ver scripts/sync-libro-transferencias.mts).
#
# Requiere el secret LIBRO_TRANSFERENCIAS_URL con el link "Cualquiera con el
# vínculo" del archivo (si es "Personas de la organización", SharePoint pide
# sesión de Microsoft 365 que este workflow no puede dar y falla con 403).
name: Sincronizar libro de transferencias

on:
  schedule:
    - cron: '0 18 * * *' # 12:00 (mediodía) hora de Ciudad de México (UTC-6)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:libro-transferencias -- --apply
        env:
          LIBRO_TRANSFERENCIAS_URL: ${{ secrets.LIBRO_TRANSFERENCIAS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
