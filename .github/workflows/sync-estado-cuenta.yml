# Trae el "ESTADO DE CUENTA CLIENTES" de OneDrive/SharePoint y registra los
# pagos nuevos (misma lógica y deduplicación que "Importar de Excel" — ver
# scripts/sync-estado-cuenta.mts).
#
# DESACTIVADO EN AUTOMÁTICO (2026-09-02): a partir de septiembre las
# transferencias entran por "Sincronizar libro de transferencias" (formato
# nuevo). Este workflow queda solo para disparo manual, por si hace falta
# reprocesar el estado de cuenta histórico. Si se re-activa el `schedule`,
# volvería a cargar los pagos viejos.
#
# Requiere el secret ESTADO_CUENTA_URL con el link "Cualquiera con el
# vínculo" del archivo (si es "Personas de la organización", SharePoint pide
# una sesión de Microsoft 365 que este workflow no puede dar y falla con 403).
name: Sincronizar estado de cuenta (manual)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:estado-cuenta -- --apply
        env:
          ESTADO_CUENTA_URL: ${{ secrets.ESTADO_CUENTA_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
